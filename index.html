<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GARBAT</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- CONTROL FRUIT DOMAIN -->

<div class="floating-species">

    <img
    src="bred.png"
    class="species bred"
    alt="BRED">

    <img
    src="Quantum Mango.png"
    class="species mango"
    alt="Quantum Mango">

    <img
    src="earbat.png"
    class="species bat"
    alt="Earbat">

    <img
    src="Refrigerator.png"
    class="species fridge"
    alt="Refrigerator">

</div>

<!-- MAIN CONTENT -->

<div class="container">

    <div class="card">

        <h1>GARBAT</h1>

    <p class="subtitle">
    Government Agency Ran by A Toaster
</p>

  <p class="version">
    GARBAT Build 5.3
</p>

 <input
type="text"
placeholder="Enter Name"
onkeydown="
if(event.key==='Enter'){
continueAssessment();
}
">

        <button
        onclick="continueAssessment()">

            Continue

        </button>

    </div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script src="script.js"></script>
