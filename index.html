<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BRED</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- CONTROL FRUIT DOMAIN -->

<div class="floating-species">

    <img
    src="bred.png"
    class="species bred"
    alt="BRED">

    <img
    src="Quantum Mango.png"
    class="species mango"
    alt="Quantum Mango">

    <img
    src="earbat.png"
    class="species bat"
    alt="Earbat">

    <img
    src="Refrigerator.png"
    class="species fridge"
    alt="Refrigerator">

</div>

<!-- MAIN CONTENT -->

<div class="container">

    <div class="card">

        <h1>BRED</h1>

        <p class="subtitle">

            Compatibility Assessment Portal

        </p>

        <p class="version">

            Assessment Build 6.0

        </p>

        <input
        type="text"
        placeholder="Enter Name">

        <button
        onclick="continueAssessment()">

            Continue

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
